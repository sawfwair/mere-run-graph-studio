[package]
name = "mere-graph-studio"
version = "0.3.0"
description = "Native desktop host for Mere Graph Studio"
authors = ["Sawfwair Inc."]
edition = "2024"
license = "MIT"
homepage = "https://github.com/sawfwair/mere-run-graph-studio"
repository = "https://github.com/sawfwair/mere-run-graph-studio"

[lib]
name = "mere_graph_studio_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
mime_guess = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
which = "8"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
